
name: Mob Fusion Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Mob Fusion Source
        run: |
          unzip -q MobFusion-Fabric-1.20.1-Source-FIXED.zip -d mobfusion-mod
          ls -la mobfusion-mod

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build Mob Fusion
        run: gradle build --stacktrace
        working-directory: mobfusion-mod

      - name: Upload Mob Fusion JAR
        uses: actions/upload-artifact@v4
        with:
          name: Mob-Fusion-Fabric-1.20.1
          path: mobfusion-mod/build/libs/*.jar
